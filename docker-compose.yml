services:
  postgres:
    image: postgres:17
    container_name: irctc-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: irctc-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: irctc-redis
    restart: always
    command: redis-server --requirepass mysecretpassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: irctc-redisinsight
    restart: always
    ports:
      - "8001:5540"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data: